name: ProtonVPN WireGuard Auto-Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */24 * * *'

permissions:
  contents: write

jobs:
  update-vpn-configs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: pip install selenium requests

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1

    - name: Run Downloader Script
      env:
        VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
        VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python proton_downloader_chrome.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"

        if [ -f "ProtonVPN_WireGuard_Configs.zip" ]; then
          # 生成时间戳文件，确保每次 commit 都有内容变化
          echo "Updated: $(date -u)" > last_update.txt

          git add ProtonVPN_WireGuard_Configs.zip downloaded_wg_ids.json last_update.txt

          git commit -m "🔄 Update WireGuard Configs [$(date -u '+%a %b %d %H:%M:%S UTC %Y')]"
          git push
        else
          echo "No ZIP file found to upload."
          exit 1
        fi
